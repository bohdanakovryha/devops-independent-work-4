[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-bohdana"
version = "0.1.0"
description = "A minimal tutorial package with a hello() function"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Bohdana Hulenko" }]
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
